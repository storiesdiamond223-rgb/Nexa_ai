name: Build Nexa APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-22.04
    steps:
      - name: Download Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      # Capacitor 7+ needs Java 21 (Java 17 causes "invalid source release: 21")
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"

      # GitHub's Ubuntu runner already has the Android SDK installed,
      # so we skip the setup-android action and just accept the licenses.
      - name: Accept Android licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Prepare Web Files
        run: |
          ls -la
          mkdir -p www
          cp index.html www/
          cp manifest.json www/ || echo "no manifest"
          cp icon.png www/ || echo "no icon"
          ls -la www/

      # Capacitor needs a package.json and a config file, or "cap add" fails
      - name: Install Capacitor
        run: |
          [ -f package.json ] || npm init -y
          npm install @capacitor/cli @capacitor/core @capacitor/android

      - name: Create Capacitor config
        run: |
          if [ ! -f capacitor.config.json ] && [ ! -f capacitor.config.ts ]; then
            cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.nexa.app",
            "appName": "Nexa",
            "webDir": "www"
          }
          EOF
          fi
          cat capacitor.config.*

      - name: Add Android Project
        run: |
          [ -d android ] || npx cap add android
          npx cap sync android
          ls -la android/

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          # Gradle download timed out at 10s, so allow 2 minutes
          sed -i 's/networkTimeout=.*/networkTimeout=120000/' gradle/wrapper/gradle-wrapper.properties
          cat gradle/wrapper/gradle-wrapper.properties
          # GitHub returned 504 for the Gradle download, so try the official
          # link first, then a backup mirror, and retry each one
          for URL in \
            "https://services.gradle.org/distributions/gradle-8.14.3-all.zip" \
            "https://mirrors.cloud.tencent.com/gradle/gradle-8.14.3-all.zip" \
            "https://services.gradle.org/distributions/gradle-8.14.3-all.zip"
          do
            sed -i "s|^distributionUrl=.*|distributionUrl=${URL}|" gradle/wrapper/gradle-wrapper.properties
            echo "Trying Gradle from: ${URL}"
            ./gradlew assembleDebug --stacktrace && exit 0
            echo "That source failed, waiting before the next try"
            sleep 20
          done
          exit 1

      - name: Upload APK - Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Nexa-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
