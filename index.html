<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Nexa 6.0 - Speaks Any Language</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0a0a1a">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',system-ui,sans-serif}
html,body{height:100%}
body{background:#0a0a1a;color:white;display:flex;flex-direction:column;overflow:hidden}
.header{background:linear-gradient(90deg,#1e40ff,#00c6ff);padding:14px 14px 12px;display:flex;align-items:center;gap:12px}
.logo{width:52px;height:52px;background:white;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:30px;flex-shrink:0;overflow:hidden}
.logo img{width:100%;height:100%;object-fit:cover}
.header h1{font-size:26px;line-height:1}
.header h1 span{font-size:11px;color:#22ff88}
.header p{font-size:12px;opacity:.9;margin-top:2px}
.controls{display:flex;gap:8px;padding:10px;background:#0a0a1a;overflow-x:auto}
.controls::-webkit-scrollbar,.quick::-webkit-scrollbar{display:none}
.pill{background:#1e1e35;border:1px solid #333;padding:8px 14px;border-radius:999px;font-size:13px;white-space:nowrap;display:flex;align-items:center;gap:6px;color:white;cursor:pointer}
.pill select{background:transparent;color:white;border:none;outline:none;font-size:13px}
.pill select option{color:black}
#chat{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:85%;padding:12px 14px;border-radius:18px;font-size:16px;line-height:1.5;word-wrap:break-word;white-space:pre-wrap}
.msg.ai{background:#262640;align-self:flex-start;border-bottom-left-radius:6px}
.msg.user{background:#1e6bff;align-self:flex-end;border-bottom-right-radius:6px}
.msg b{color:#38bdf8}
.msg img{display:block;width:100%;border-radius:12px;margin-top:8px}
.quick{display:flex;gap:8px;padding:8px 10px;overflow-x:auto;background:#0a0a1a}
.qbtn{background:#1e1e35;border:1px solid #333;color:white;padding:8px 14px;border-radius:999px;font-size:13px;white-space:nowrap;cursor:pointer}
.inputRow{display:flex;gap:8px;padding:10px 10px 16px;background:#0a0a1a}
.micBtn{width:50px;height:50px;border-radius:50%;background:#262640;border:none;font-size:24px;cursor:pointer;flex-shrink:0}
.micBtn.on{background:#dc2626}
#userInput{flex:1;min-width:0;background:#262640;border:none;outline:none;color:white;padding:0 16px;border-radius:999px;font-size:15px}
#userInput::placeholder{color:#888}
.sendBtn{background:linear-gradient(135deg,#1e6bff,#00c6ff);border:none;color:white;padding:0 18px;border-radius:999px;font-weight:700;font-size:14px;cursor:pointer;line-height:1.2}
.typing{font-style:italic;opacity:.7}
</style>
</head>
<body>

<div class="header">
  <div class="logo"><img src="icon.png" alt="Nexa" onerror="this.parentElement.textContent='🌍'"></div>
  <div>
    <h1>Nexa 6.0 <span>●</span></h1>
    <p>Speaks Any Language • Built by Mr Wayne</p>
  </div>
</div>

<div class="controls">
  <div class="pill">🌍 <select id="langSelect">
    <option value="auto">Auto - Detect</option>
    <option value="English">English</option>
    <option value="Yoruba">Yoruba</option>
    <option value="Igbo">Igbo</option>
    <option value="Hausa">Hausa</option>
    <option value="Pidgin">Pidgin</option>
    <option value="French">French</option>
    <option value="Spanish">Spanish</option>
    <option value="Arabic">Arabic</option>
    <option value="Hindi">Hindi</option>
    <option value="Chinese">Chinese</option>
  </select></div>
  <button class="pill" id="voiceBtn" onclick="toggleVoice()">🔊 Voice: ON</button>
  <button class="pill" onclick="clearChat()">🗑️ Clear</button>
</div>

<div id="chat"></div>

<div class="quick">
  <button class="qbtn" onclick="quickSend('Hello')">👋 Hello</button>
  <button class="qbtn" onclick="quickSend('Draw a lion for me')">🎨 Draw Lion</button>
  <button class="qbtn" onclick="quickSend('Speak in Yoruba')">Yoruba</button>
  <button class="qbtn" onclick="quickSend('Speak in French')">French</button>
</div>

<div class="inputRow">
  <button class="micBtn" id="micBtn" onclick="startVoice()">🎤</button>
  <input id="userInput" placeholder="Ask in any language..." onkeypress="if(event.key==='Enter') sendMsg()">
  <button class="sendBtn" onclick="sendMsg()">Send<br>➤</button>
</div>

<script>
// ============ PUT YOUR KEY HERE ============
// Get a key at https://console.groq.com -> API Keys (starts with gsk_)
// NOTE: a key in front-end code is visible to anyone. Fine for testing;
// for a public launch, move this call to a backend/proxy.
const GROQ_API_KEY = "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";
// ===========================================

const GROQ_URL = "https://api.groq.com/openai/v1/chat/completions";
const GROQ_MODEL = "openai/gpt-oss-20b";

// Speech codes for voice input/output
const LANG_CODES = {Yoruba:"yo-NG",Igbo:"ig-NG",Hausa:"ha-NG",Pidgin:"en-NG",English:"en-US",
  French:"fr-FR",Spanish:"es-ES",Arabic:"ar-SA",Hindi:"hi-IN",Chinese:"zh-CN"};

const chatEl = document.getElementById("chat");
const inputEl = document.getElementById("userInput");
const langEl = document.getElementById("langSelect");

let userName = localStorage.getItem("nexa_name") || "";
let voiceOn = true;
let busy = false;

// log = what is shown on screen (saved). Each item: {who, text, img?}
let log = [];
try { log = JSON.parse(localStorage.getItem("nexa_log") || "[]"); } catch(e){ log = []; }
if(!Array.isArray(log)) log = [];

langEl.value = localStorage.getItem("nexa_lang") || "auto";
langEl.onchange = () => localStorage.setItem("nexa_lang", langEl.value);

function saveLog(){
  try { localStorage.setItem("nexa_log", JSON.stringify(log.slice(-60))); } catch(e){}
}

// Build a message bubble with DOM calls only (no innerHTML), so user text can't inject HTML
function render(item){
  const d = document.createElement("div");
  d.className = "msg " + item.who;
  if(item.who === "ai"){
    const b = document.createElement("b");
    b.textContent = "Nexa:";
    d.appendChild(b);
    d.appendChild(document.createTextNode(" " + item.text));
  } else {
    d.textContent = item.text;
  }
  if(item.img){
    const img = document.createElement("img");
    img.alt = "Generated image";
    img.src = item.img;
    img.onload = () => chatEl.scrollTop = chatEl.scrollHeight;
    d.appendChild(img);
  }
  chatEl.appendChild(d);
  chatEl.scrollTop = chatEl.scrollHeight;
  return d;
}

function addMsg(who, text, img){
  const item = {who, text};
  if(img) item.img = img;
  log.push(item);
  saveLog();
  return render(item);
}

function speak(text){
  if(!voiceOn || !("speechSynthesis" in window)) return;
  try{
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(String(text).slice(0, 400));
    const code = LANG_CODES[langEl.value];
    if(code){
      u.lang = code;
      const v = speechSynthesis.getVoices().find(v => v.lang.startsWith(code.slice(0,2)));
      if(v) u.voice = v;
    }
    speechSynthesis.speak(u);
  }catch(e){}
}

function toggleVoice(){
  voiceOn = !voiceOn;
  document.getElementById("voiceBtn").textContent = voiceOn ? "🔊 Voice: ON" : "🔇 Voice: OFF";
  if(!voiceOn && "speechSynthesis" in window) speechSynthesis.cancel();
}

// Clear chat but keep the user's name
function clearChat(){
  log = [];
  saveLog();
  chatEl.innerHTML = "";
  greet();
}

function greet(){
  if(userName) addMsg("ai", "Chat cleared. I still remember you, " + userName + ". How can I help?");
  else addMsg("ai", "Hello! I am Nexa. I can speak any language. What is your name?");
}

function quickSend(t){ inputEl.value = t; sendMsg(); }

function startVoice(){
  const Rec = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!Rec){ alert("Voice input is not supported on this browser. Try Chrome."); return; }
  const rec = new Rec();
  rec.lang = LANG_CODES[langEl.value] || "en-US";
  const btn = document.getElementById("micBtn");
  btn.classList.add("on");
  rec.onresult = e => { inputEl.value = e.results[0][0].transcript; sendMsg(); };
  rec.onend = rec.onerror = () => btn.classList.remove("on");
  rec.start();
}

// Extract a plausible name, or return "" if the text doesn't look like one
function parseName(text){
  const cleaned = text.replace(/my name is|call me|i am|i'm/gi, "").replace(/[.!,]/g, "").trim();
  const words = cleaned.split(/\s+/).filter(Boolean);
  const notNames = /^(hi|hello|hey|yo|help|ok|okay|yes|no|thanks|test)$/i;
  if(!words.length || words.length > 3 || cleaned.length > 30 || /\?/.test(text) || notNames.test(cleaned)) return "";
  return words.map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(" ");
}

// Only treat clear drawing requests as image requests
const IMAGE_TRIGGER = /\b(draw|generate (an? )?image|(a )?(picture|image) of)\b/i;
const IMAGE_STRIP = /\b(draw|generate (an? )?image( of)?|(a )?(picture|image) of|for me|please)\b/gi;

// Chat history sent to the model, rebuilt from the saved log (text only, last 6)
function apiHistory(){
  return log.filter(m => !m.img && m.text)
    .map(m => ({role: m.who === "user" ? "user" : "assistant", content: m.text}))
    .slice(-6);
}

async function askGroq(){
  const lang = langEl.value;
  const langRule = lang !== "auto"
    ? "Reply ONLY in " + lang + ". "
    : "Detect the language the user is writing in and reply in that same language. If the user speaks Pidgin, reply in Pidgin. ";
  const system = "You are Nexa, a friendly personal AI built by Mr Wayne. " + langRule +
    "User name is " + (userName || "friend") + ". Keep answers short, fun and helpful. " +
    "If the user asks you to speak a language, do it. If they ask for a translation, translate. " +
    "Never say you are Meta AI or ChatGPT; you are Nexa.";

  const res = await fetch(GROQ_URL, {
    method: "POST",
    headers: {"Content-Type":"application/json", "Authorization":"Bearer " + GROQ_API_KEY},
    body: JSON.stringify({
      model: GROQ_MODEL,
      messages: [{role:"system", content:system}, ...apiHistory()],
      temperature: 0.7,
      max_tokens: 900,
      reasoning_effort: "medium"
    })
  });
  if(!res.ok){
    const err = await res.text();
    const e = new Error("Groq error " + res.status + ": " + err.slice(0, 200));
    e.status = res.status;
    throw e;
  }
  const data = await res.json();
  return data.choices[0].message.content;
}

async function sendMsg(){
  if(busy) return;
  const text = inputEl.value.trim();
  if(!text) return;
  inputEl.value = "";
  addMsg("user", text);

  // First time: ask for a name, and only accept something that looks like one
  if(!userName){
    const name = parseName(text);
    if(!name){
      const a = "I'd love to know your name first. What should I call you?";
      addMsg("ai", a); speak(a);
      return;
    }
    userName = name;
    localStorage.setItem("nexa_name", userName);
    const a = "Nice to meet you, " + userName + ". I am Nexa, your personal AI, built by Mr Wayne. I can speak any language. How can I help you today?";
    addMsg("ai", a); speak(a);
    return;
  }

  // Image request
  if(IMAGE_TRIGGER.test(text)){
    const subject = text.replace(IMAGE_STRIP, "").replace(/\s+/g, " ").trim() || "lion";
    const url = "https://image.pollinations.ai/prompt/" +
      encodeURIComponent(subject + " beautiful colorful high quality") +
      "?width=512&height=512&nologo=true&seed=" + Date.now();
    addMsg("ai", "Here is your " + subject + " 🎨", url);
    speak("Here is your " + subject);
    return;
  }

  // Normal chat
  busy = true;
  const typing = render({who:"ai", text:"typing..."});
  typing.classList.add("typing");
  try{
    if(GROQ_API_KEY.startsWith("PASTE")) throw new Error("No API key set. Add your Groq key at the top of the script.");
    const reply = await askGroq();
    typing.remove();
    addMsg("ai", reply);
    speak(reply);
  }catch(e){
    console.error(e);
    typing.remove();
    let why = e.message;
    if(e.status === 401) why = "Your API key is invalid or expired.";
    else if(e.status === 429) why = "Rate limit or quota reached. Try again shortly.";
    else if(e.status === 404 || e.status === 400) why = "Model or request problem. " + e.message;
    else if(e instanceof TypeError) why = "Network problem. Check your connection.";
    // Errors are shown but not saved, so they don't pollute the chat history
    render({who:"ai", text:"Sorry, I could not answer, " + userName + ". " + why});
  }
  busy = false;
}

// Start: restore saved chat or greet
if(log.length){
  log.forEach(render);
} else if(userName){
  addMsg("ai", "Welcome back, " + userName + "! How can I help you today?");
} else {
  greet();
}
</script>
</body>
</html>
