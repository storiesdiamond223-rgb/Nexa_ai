<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nexa - Your Personal AI</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2563eb">
<link rel="icon" type="image/png" href="icon.png">
<style>
    * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
  body { margin:0; background:#0f0f1a; color:white; display:flex; justify-content:center; }
  .app { width:100%; max-width:480px; height:100vh; display:flex; flex-direction:column; background:#1a1a2e; }
  .header { background: linear-gradient(135deg, #2563eb, #06b6d4); padding:12px 16px; display:flex; align-items:center; gap:12px; }
  .logo { width:48px; height:48px; background:white; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:26px; }
  .header h2 { margin:0; font-size:20px; }
  .header p { margin:2px 0 0; font-size:12px; opacity:0.9; }
  .online { width:10px; height:10px; background:#22c55e; border-radius:50%; display:inline-block; margin-left:5px; }
  .top-btns { display:flex; gap:8px; padding:8px 12px; background:#161627; flex-wrap:wrap; }
  .top-btns button, .top-btns select { flex:1; background:#2a2a45; border:1px solid #3a3a5a; color:white; padding:8px; border-radius:20px; font-size:12px; cursor:pointer; min-width:90px; }
  #installBtn { display:none; background:#22c55e !important; font-weight:bold; }
  #chat { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:12px; }
  .msg { max-width:85%; padding:12px 14px; border-radius:18px; line-height:1.5; font-size:15px; }
  .you { background:#2563eb; align-self:flex-end; border-bottom-right-radius:4px; }
  .nexa { background:#2a2a45; align-self:flex-start; border-bottom-left-radius:4px; border:1px solid #3a3a5a; }
  .nexa b { color:#38bdf8; }
  .msg img { width:100%; border-radius:12px; margin-top:8px; }
  .input-area { padding:12px; background:#161627; display:flex; gap:8px; }
  #msg { flex:1; padding:14px; border-radius:25px; border:1px solid #3a3a5a; background:#2a2a45; color:white; outline:none; font-size:15px; }
  button.send { background: linear-gradient(135deg, #2563eb, #06b6d4); color:white; border:none; padding:0 18px; border-radius:25px; font-weight:bold; cursor:pointer; }
  .chips { display:flex; gap:8px; padding:0 12px 10px; background:#161627; overflow-x:auto; }
  .chip { background:#2a2a45; border:1px solid #3a3a5a; padding:7px 12px; border-radius:20px; font-size:12px; white-space:nowrap; cursor:pointer; }
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <div class="logo">🌍</div>
    <div><h2>Nexa 6.0 <span class="online"></span></h2><p>Speaks Any Language • Built by Mr Wayne</p></div>
  </div>
  <div class="top-btns">
    <select id="langSelect" onchange="changeLang()">
      <option value="auto">🌍 Auto - Detect Language</option>
      <option value="English">🇬🇧 English</option>
      <option value="Nigerian Pidgin">🇳🇬 Pidgin</option>
      <option value="Yoruba">Yoruba</option>
      <option value="Igbo">Igbo</option>
      <option value="Hausa">Hausa</option>
      <option value="French">🇫🇷 French</option>
      <option value="Spanish">🇪🇸 Spanish</option>
      <option value="Portuguese">🇵🇹 Portuguese</option>
      <option value="Arabic">🇸🇦 Arabic</option>
      <option value="Chinese">🇨🇳 Chinese</option>
      <option value="German">🇩🇪 German</option>
    </select>
    <button id="installBtn" onclick="installApp()">📲 Install App</button>
    <button onclick="toggleVoice()">🔊 Voice: <span id="voiceState">ON</span></button>
    <button onclick="clearChat()">🗑️ Clear</button>
  </div>
  <div id="chat"></div>
  <div class="chips">
    <div class="chip" onclick="quick('Hello Nexa, how are you?')">👋 Hello</div>
    <div class="chip" onclick="quick('Draw a lion for me')">🎨 Draw Lion</div>
    <div class="chip" onclick="quick('Speak in Yoruba')">Yoruba</div>
    <div class="chip" onclick="quick('Parle en français')">French</div>
  </div>
  <div class="input-area">
    <button onclick="listen()" style="background:#2a2a45; border:1px solid #3a3a5a; color:white; border-radius:50%; width:48px; height:48px; font-size:20px; cursor:pointer;">🎤</button>
    <input id="msg" placeholder="Ask in any language..." onkeypress="if(event.key==='Enter') ask()">
    <button class="send" onclick="ask()">Send ➤</button>
  </div>
</div>

<script>
let deferredPrompt;
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault(); deferredPrompt = e;
  document.getElementById('installBtn').style.display = 'block';
});
function installApp(){
  if(deferredPrompt){ deferredPrompt.prompt(); deferredPrompt.userChoice.then(()=>{ deferredPrompt=null; document.getElementById('installBtn').style.display='none'; }); }
}

let myName = localStorage.getItem("nexa_name") || "";
let voiceOn = true;
let chatHistory = JSON.parse(localStorage.getItem("nexa_chat") || "[]");
let currentLang = localStorage.getItem("nexa_lang") || "auto";
document.getElementById("langSelect").value = currentLang;
let langCodes = { "English":"en-US", "Nigerian Pidgin":"en-NG", "Yoruba":"yo-NG", "Igbo":"ig-NG", "Hausa":"ha-NG", "French":"fr-FR", "Spanish":"es-ES", "Portuguese":"pt-PT", "Arabic":"ar-SA", "Chinese":"zh-CN", "German":"de-DE", "auto":"en-US" };
function changeLang(){ currentLang = document.getElementById("langSelect").value; localStorage.setItem("nexa_lang", currentLang); let msg = currentLang==="auto" ? "Auto language ON. I will reply in whatever language you use." : "Language changed to " + currentLang + ". I will now reply in " + currentLang + "."; addMsg("nexa", msg); speak(msg); }
function saveChat(){ localStorage.setItem("nexa_chat", JSON.stringify(chatHistory.slice(-50))); }
function addMsg(who, text, isImage=false){ chatHistory.push({who, text, isImage}); saveChat(); renderOne(who, text, isImage); }
function renderOne(who, text, isImage){ let div = document.createElement("div"); div.className = "msg " + (who==="you" ? "you" : "nexa"); if(isImage){ div.innerHTML = "<b>Nexa:</b> Here is your image.<br><img src='"+text+"'>"; } else { div.innerHTML = who==="you" ? text : "<b>Nexa:</b> " + text; } document.getElementById("chat").appendChild(div); document.getElementById("chat").scrollTop = document.getElementById("chat").scrollHeight; }
function clearChat(){ localStorage.removeItem("nexa_chat"); chatHistory=[]; document.getElementById("chat").innerHTML=""; addMsg("nexa","Chat cleared. I still remember you, "+myName+"."); }
function toggleVoice(){ voiceOn = !voiceOn; document.getElementById("voiceState").innerText = voiceOn ? "ON" : "OFF"; if(!voiceOn) speechSynthesis.cancel(); }
function speak(text, langOverride=""){ if(!voiceOn) return; speechSynthesis.cancel(); let u = new SpeechSynthesisUtterance(text.replace(/<[^>]*>/g,"").slice(0,400)); let langName = langOverride || (currentLang==="auto" ? "English" : currentLang); u.lang = langCodes[langName] || "en-US"; u.rate = 1.0; u.pitch = 1.0; speechSynthesis.speak(u); }
function listen(){ let Rec = window.SpeechRecognition || window.webkitSpeechRecognition; if(!Rec){ alert("Your browser does not support voice input. Please use Chrome."); return; } let r = new Rec(); r.lang = currentLang==="auto" ? "en-US" : (langCodes[currentLang] || "en-US"); r.start(); r.onresult = e => { document.getElementById("msg").value = e.results[0][0].transcript; ask(); }; }
function quick(t){ document.getElementById("msg").value=t; ask(); }
async function ask(){
  let q = document.getElementById("msg").value.trim(); if(!q) return;
  let qLower = q.toLowerCase(); document.getElementById("msg").value=""; addMsg("you", q);
  if(!myName){ let newName=""; if(qLower.includes("my name is") || qLower.includes("i am")) newName = q.replace(/my name is|i am/gi,"").trim(); else if(q.split(" ").length<=2 && q.length<20 && !qLower.includes("?")) newName = q.trim(); if(newName){ myName=newName; localStorage.setItem("nexa_name",myName); let a="Nice to meet you, "+myName+". I am Nexa, your personal AI, built by Mr Wayne. I can speak any language. How can I help you today?"; addMsg("nexa",a); speak(a); return; } let a="Hello! I am Nexa. Before we start, what is your name?"; addMsg("nexa",a); speak(a); return; }
  if(qLower.includes("draw") || qLower.includes("generate image") || qLower.includes("picture of") || qLower.includes("image of")){ let prompt = q.replace(/draw|generate image|picture of|image of|for me/gi,"").trim() || "lion"; let imgUrl = "https://image.pollinations.ai/prompt/" + encodeURIComponent(prompt + " high quality") + "?width=400&height=400&seed=" + Math.floor(Math.random()*9999); addMsg("nexa", imgUrl, true); speak("I have created an image of " + prompt + " for you."); return; }
  addMsg("nexa","Let me think...");
  try{ let res = await fetch("https://api.groq.com/openai/v1/chat/completions", { method:"POST", headers:{ "Authorization":"Bearer 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", "Content-Type":"application/json" }, body: JSON.stringify({ model:"openai/gpt-oss-20b", messages:[ {role:"system", content:"You are Nexa, a helpful personal AI assistant built by Mr Wayne, CEO of ChatNexus. User name is "+myName+". LANGUAGE RULE: If user selected language is "+currentLang+" and it is not 'auto', you MUST reply ONLY in "+currentLang+". If language is 'auto', detect the language of the user's last message and reply in that EXACT same language. Be natural, helpful, concise."}, {role:"user", content:q} ] }) }); let data = await res.json(); let answer = data.choices[0].message.content; document.getElementById("chat").lastChild.remove(); chatHistory.pop(); saveChat(); addMsg("nexa", answer); speak(answer); }catch(e){ let a="Sorry, I could not connect right now, "+myName+". Please check your connection or API key."; document.getElementById("chat").lastChild.remove(); chatHistory.pop(); saveChat(); addMsg("nexa",a); speak(a); }
}
if(chatHistory.length>0){ chatHistory.forEach(c=>renderOne(c.who,c.text,c.isImage)); }
else if(myName){ addMsg("nexa","Welcome back, "+myName+". I can speak any language now. Try me!"); }
else { addMsg("nexa","Hello! I am Nexa. I can speak any language. What is your name?"); }
</script>
</body>
  </html>
